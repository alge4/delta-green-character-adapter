name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (unit/contract packages)
        run: pnpm check

      - name: Test (unit, contract, corpus, inventory, determinism, round trips, Foundry harness, browser snapshots)
        run: pnpm test

      - name: Build (packages + Foundry production artifact)
        run: pnpm build

      - name: Assert Foundry production artifact metadata
        run: |
          test -f apps/foundry-module/artifact/delta-green-character-adapter/module.json
          test -f apps/foundry-module/artifact/delta-green-character-adapter/main.js
          test -f apps/foundry-module/artifact/delta-green-character-adapter/styles/styles.css
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const m=JSON.parse(readFileSync('apps/foundry-module/artifact/delta-green-character-adapter/module.json','utf8')); if(m.compatibility.verified!=='14.365') process.exit(1); if(m.relationships.systems[0].compatibility.verified!=='1.7.0') process.exit(1); if(m.flags.deltaGreenCharacterAdapter.verifiedCapabilities.length!==3) process.exit(1);"
