name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (unit/contract packages)
        run: pnpm check

      - name: Test (unit, contract, corpus, inventory, determinism, round trips, Foundry harness, browser snapshots)
        run: pnpm test

      - name: Build (packages + Foundry production artifact)
        run: pnpm build

      - name: Assert Foundry production artifact metadata and corrected bootstrap
        run: node apps/foundry-module/scripts/assert-packaged-artifact.mjs
